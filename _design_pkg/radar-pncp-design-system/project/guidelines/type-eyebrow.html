<!-- @dsCard group="Type" viewport="700x150" name="Weights & eyebrow" subtitle="Weight ramp 400–800 and the uppercase eyebrow label" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { background: var(--surface); padding: 24px 32px; display: flex; flex-direction: column; gap: 18px; }
  .weights { display: flex; gap: 28px; align-items: baseline; flex-wrap: wrap; }
  .w { font-size: 26px; color: var(--text-strong); letter-spacing: var(--tracking-tight); }
  .w small { display: block; font-family: var(--font-mono); font-size: 10px; color: var(--text-subtle); font-weight: 400; letter-spacing: 0; }
</style>
</head>
<body>
  <div class="weights">
    <span class="w" style="font-weight:400">Aa<small>Regular 400</small></span>
    <span class="w" style="font-weight:500">Aa<small>Medium 500</small></span>
    <span class="w" style="font-weight:600">Aa<small>Semibold 600</small></span>
    <span class="w" style="font-weight:700">Aa<small>Bold 700</small></span>
    <span class="w" style="font-weight:800">Aa<small>Black 800</small></span>
  </div>
  <div class="eyebrow">Oportunidade em destaque · Radar PNCP</div>
</body>
</html>
