<!-- @dsCard group="Spacing" viewport="700x180" name="Corner radii" subtitle="xs 4 · sm 6 · md 10 · lg 14 · xl 20 · pill" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { background: var(--surface); padding: 26px; display: flex; gap: 20px; align-items: flex-end; flex-wrap: wrap; }
  .item { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .box { width: 76px; height: 64px; background: var(--brand-soft); border: 1.5px solid var(--brand); }
  .name { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="item"><div class="box" style="border-radius:var(--radius-xs)"></div><span class="name">xs · 4</span></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-sm)"></div><span class="name">sm · 6</span></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-md)"></div><span class="name">md · 10</span></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-lg)"></div><span class="name">lg · 14</span></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-xl)"></div><span class="name">xl · 20</span></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-pill);width:96px"></div><span class="name">pill</span></div>
</body>
</html>
