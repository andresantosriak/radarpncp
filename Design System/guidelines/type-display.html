<!-- @dsCard group="Type" viewport="700x300" name="Display & headings" subtitle="Hanken Grotesk — page titles, hero, section heads" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { background: var(--surface); padding: 28px 32px; }
  .row { display: flex; align-items: baseline; gap: 16px; padding: 8px 0; border-bottom: 1px solid var(--border-subtle); }
  .row:last-child { border: 0; }
  .spec { font-family: var(--font-mono); font-size: 11px; color: var(--text-subtle); width: 120px; flex: none; letter-spacing: 0; }
  .sample { color: var(--text-strong); font-weight: var(--fw-bold); letter-spacing: var(--tracking-tight); line-height: 1.05; }
</style>
</head>
<body>
  <div class="row"><span class="spec">5xl · 64 · 800</span><span class="sample" style="font-size:var(--text-5xl);font-weight:var(--fw-black)">87</span></div>
  <div class="row"><span class="spec">3xl · 36 · 700</span><span class="sample" style="font-size:var(--text-3xl)">Radar de oportunidades</span></div>
  <div class="row"><span class="spec">2xl · 28 · 700</span><span class="sample" style="font-size:var(--text-2xl)">Editais que combinam com você</span></div>
  <div class="row"><span class="spec">xl · 22 · 700</span><span class="sample" style="font-size:var(--text-xl)">Análise estratégica da IA</span></div>
  <div class="row"><span class="spec">lg · 18 · 600</span><span class="sample" style="font-size:var(--text-lg);font-weight:var(--fw-semibold)">Plataforma de atendimento digital</span></div>
</body>
</html>
