<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { Toast, Tooltip, Dialog, Button, IconButton } = window.RadarPNCPDesignSystem_ba9943;
    function Demo() {
      const [open, setOpen] = React.useState(false);
      return (
        <div>
          <div className="label">Toasts (alertas)</div>
          <div className="col">
            <Toast tone="gold" title="Nova oportunidade · score 91" message="Plataforma de atendimento digital · R$ 78.000 · prazo 12/06" onClose={()=>{}} />
            <Toast tone="success" title="Proposta gerada" message="Valor recomendado: R$ 48.000–54.000" onClose={()=>{}} />
            <Toast tone="danger" title="Falha ao ler edital" message="PDF protegido — tente novamente." onClose={()=>{}} />
          </div>
          <div className="label">Tooltip · Dialog</div>
          <div className="row">
            <Tooltip content="Score = aderência técnica + CNAE + prazo + valor + risco jurídico">
              <Button variant="secondary" iconLeft={<Icon name="help-circle" />}>Como o score funciona</Button>
            </Tooltip>
            <Button variant="primary" onClick={()=>setOpen(true)}>Gerar proposta</Button>
          </div>
          <Dialog open={open} onClose={()=>setOpen(false)} title="Gerar proposta"
            subtitle="Composição automática de custos pela IA"
            footer={<><Button variant="ghost" onClick={()=>setOpen(false)}>Cancelar</Button><Button variant="primary" onClick={()=>setOpen(false)}>Gerar</Button></>}>
            <p style={{margin:0}}>Vamos estimar horas técnicas, implantação, manutenção e impostos para sugerir uma faixa de proposta saudável.</p>
          </Dialog>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
