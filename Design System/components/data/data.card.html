<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { background: var(--bg-app); padding: 24px; margin: 0; }
  .demo { display: flex; flex-direction: column; gap: 18px; }
  .gauges { display: flex; gap: 24px; align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 18px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-subtle); font-weight: 600; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { Icon, ScoreGauge, StatCard, OpportunityCard } = window.RadarPNCPDesignSystem_ba9943;
    function Demo() {
      return (
        <div className="demo">
          <div>
            <div className="label" style={{marginBottom:8}}>Score gauges · bandas</div>
            <div className="gauges">
              <ScoreGauge value={91} />
              <ScoreGauge value={78} />
              <ScoreGauge value={54} />
              <ScoreGauge value={28} />
              <ScoreGauge value={87} size={64} stroke={6} />
            </div>
          </div>
          <div>
            <div className="label" style={{marginBottom:8}}>Stat cards</div>
            <div className="stats">
              <StatCard label="Oportunidades ativas" value="34" icon={<Icon name="radar" />} delta="+12" sub="esta semana" />
              <StatCard label="Editais urgentes" value="6" tone="danger" icon={<Icon name="alarm-clock" />} />
              <StatCard label="Valor em jogo" value="R$ 1,2M" tone="gold" icon={<Icon name="banknote" />} />
            </div>
          </div>
          <div>
            <div className="label" style={{marginBottom:8}}>Opportunity card</div>
            <OpportunityCard
              orgao="Prefeitura de Sobral" cidade="Sobral" estado="CE"
              titulo="Contratação de plataforma de atendimento digital com chatbot e IA"
              modalidade="Dispensa eletrônica" valor="R$ 62.000" prazo="14/06/2026"
              score={87} urgente
              recomendacao="Participar — objeto compatível com automação, IA e atendimento digital."
              onClick={()=>{}}
            />
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
</body>
</html>
